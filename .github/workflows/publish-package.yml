name: Package Dry Run

on:
  push:
    tags:
      - 'edge-nodes@*'
      - 'cloud-nodes@*'
      - 'common@*'

permissions:
  contents: read

concurrency:
  group: package-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    name: Validate and pack one tagged package
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require tag commit to be reachable from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.12.0
          package-manager-cache: false

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Resolve and validate tag target
        id: target
        run: node scripts/release-target.mjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Confirm exact pnpm filter matches
        run: >-
          pnpm --filter "${{ steps.target.outputs.package }}"
          --fail-if-no-match exec node -e
          "if (require('./package.json').name !== process.argv[1]) process.exit(1)"
          "${{ steps.target.outputs.package }}"

      - name: Run source quality gates
        run: |
          pnpm lint
          pnpm test
          pnpm run audit

      - name: Create pnpm dry-run report
        run: |
          mkdir -p "$RUNNER_TEMP/npm-dry-run"
          pnpm --filter "${{ steps.target.outputs.package }}" --fail-if-no-match \
            pack --dry-run --json \
            > "$RUNNER_TEMP/npm-dry-run/dry-run.json"

      - name: Pack and verify immutable release artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/npm-pack"
          case "${{ steps.target.outputs.package }}" in
            "@mqttsnet/thinglinks-cloud-nodes")
              node scripts/verify-packs.mjs --json \
                --output "$RUNNER_TEMP/npm-pack" \
                --package "${{ steps.target.outputs.package }}" \
                > "$RUNNER_TEMP/npm-pack/metadata.json"
              ;;
            "@mqttsnet/thinglinks-node-red-common"|"@mqttsnet/thinglinks-edge-nodes")
              node scripts/verify-packs.mjs --json \
                --output "$RUNNER_TEMP/npm-pack" \
                --package "@mqttsnet/thinglinks-node-red-common" \
                --package "@mqttsnet/thinglinks-edge-nodes" \
                > "$RUNNER_TEMP/npm-pack/metadata.json"
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Bind target to packed artifact and integrity
        id: artifacts
        run: >-
          node scripts/artifact-outputs.mjs
          "$RUNNER_TEMP/npm-pack/metadata.json"
          "${{ steps.target.outputs.package }}"
          >> "$GITHUB_OUTPUT"

      - name: Require published common to match the verified tarball
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: >-
          node scripts/check-published-common.mjs
          "${{ steps.target.outputs.directory }}"
          --expected-integrity "${{ steps.artifacts.outputs.common-integrity }}"

      - name: Verify the same common and Edge tarballs in Node-RED
        if: steps.target.outputs.package != '@mqttsnet/thinglinks-cloud-nodes'
        run: >-
          node scripts/verify-node-red-container.mjs
          --common-tarball "${{ steps.artifacts.outputs.common-tarball }}"
          --edge-tarball "${{ steps.artifacts.outputs.edge-tarball }}"

      - name: Upload dry-run and tgz artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.ref_name }}-dry-run
          path: |
            ${{ runner.temp }}/npm-dry-run/dry-run.json
            ${{ runner.temp }}/npm-pack/metadata.json
            ${{ steps.artifacts.outputs.target-tarball }}
          if-no-files-found: error
          retention-days: 7
